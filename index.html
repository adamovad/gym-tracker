<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">

<title>תוכנית חודש – מסה נקייה</title>
<style>
:root{color-scheme:dark;--bg:#070c1a;--card:#0e1730;--card2:#0a1228;--acc2:#132250;--ink:#f1f4ff;--mute:#9fb0d8;--line:#23325f;--blue:#2b50ff;--blue2:#1b3ad1;--acc:#ffe600;--warn:#ffe600;--warnbg:rgba(255,230,0,.08);--bad:#ff8a8a;--ok:#ffe600;--glow:0 0 16px rgba(255,230,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 420px at 50% -80px,#132a66 0%,var(--bg) 62%) fixed,var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.brand img{width:64px;height:64px;border-radius:16px;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(43,80,255,.5),0 6px 22px rgba(43,80,255,.35)}
h1{font-size:24px;margin:0;font-weight:900;font-style:italic;letter-spacing:.5px;direction:ltr;text-align:right;line-height:1.1}
h1 b{color:var(--acc);text-shadow:0 0 14px rgba(255,230,0,.45)}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
nav{position:sticky;top:0;z-index:5;background:rgba(7,12,26,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:8px 0;display:flex;gap:6px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
nav button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.pill.on{background:var(--blue);border-color:var(--acc);color:#fff;font-weight:700}
.daybtn{flex:1;min-width:140px;text-align:right;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.daybtn.on{border-color:var(--acc);background:var(--acc2);box-shadow:var(--glow)}
.daybtn small{display:block;color:var(--mute)}
.daybtn .ck{float:left;color:var(--acc);font-weight:900;text-shadow:var(--glow)}
.note{background:var(--warnbg);border:1px solid rgba(255,230,0,.28);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.info{background:var(--acc2);border-right:3px solid var(--acc);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exh b{font-size:16px}
.tag{background:rgba(255,230,0,.12);color:var(--acc);border:1px solid rgba(255,230,0,.3);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:800;white-space:nowrap}
.hint{color:var(--mute);font-size:13px;margin:2px 0 6px}
.set{display:flex;align-items:center;gap:8px;margin:5px 0}
.set span.n{width:42px;color:var(--mute);font-size:13px}
input[type=number],input[type=date],input[type=text],textarea,select{font:inherit;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
input::placeholder,textarea::placeholder{color:#6d7fae}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.set input[type=number]{width:84px;text-align:center}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border:2px solid #5d70a8;border-radius:7px;background:var(--card2);position:relative;cursor:pointer}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc);box-shadow:var(--glow)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #0a1020;border-width:0 3px 3px 0;transform:rotate(45deg)}
.vid{color:var(--acc);font-weight:700;text-decoration:none}
.flag{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.flag.on{color:var(--bad);font-weight:700}
.btn{padding:12px 16px;border-radius:12px;border:0;background:var(--acc);color:#0a1020;font:inherit;font-weight:800;cursor:pointer;box-shadow:var(--glow)}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.row:has(.daybtn){align-items:stretch}
.stat{background:var(--acc2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:10px;background:var(--card2);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--acc));border-radius:6px}
.meal{display:flex;gap:10px;align-items:flex-start}
.meal .body{flex:1}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.chip{text-align:right;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc2);box-shadow:inset 0 0 0 1px rgba(255,230,0,.35)}
.chip small{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mute);font-weight:600}
h2{font-size:18px;margin:6px 0;color:var(--ink)}
h2::before{content:"";display:inline-block;width:4px;height:16px;background:var(--acc);border-radius:2px;margin-left:8px;vertical-align:-2px;box-shadow:var(--glow)}
h3{font-size:16px;margin:10px 0 4px}
ul{padding-right:20px;margin:6px 0}
li{margin:3px 0}
label.f{display:block;font-size:13px;color:var(--mute);margin:6px 0 2px}
.small{font-size:13px;color:var(--mute)}
a{color:var(--acc)}

body{background:radial-gradient(900px 520px at 50% -140px,#1a3a92 0%,transparent 62%),linear-gradient(180deg,#0a1940 0%,#060c22 55%,#050a1b 100%) fixed,#050a1b}
.card{background:linear-gradient(165deg,rgba(32,66,156,.38),rgba(11,21,50,.94) 58%);border:1px solid rgba(90,130,255,.22);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav{gap:0;padding:6px 0 8px;border-bottom:1px solid rgba(90,130,255,.18);background:rgba(6,12,34,.9)}
nav button{background:transparent;border:0;border-radius:0;padding:6px 2px 8px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:transparent;box-shadow:none;color:var(--acc)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(255,230,0,.7))}
nav button.on::after{content:"";position:absolute;bottom:0;left:30%;right:30%;height:3px;border-radius:3px;background:var(--acc);box-shadow:var(--glow)}
.sec{margin:16px 4px 6px}
.sec small{display:block;font-size:12px;letter-spacing:1px;color:var(--mute)}
.sec b{font-size:19px;font-weight:800}
.kv{display:flex;flex-direction:column;gap:12px}
.kv div{display:flex;flex-direction:column}
.kv small{font-size:12px;color:var(--mute)}
.kv b{font-size:24px;color:var(--acc);line-height:1.1}
.perf{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rings{display:flex;justify-content:space-around;gap:8px}
.ringbox{text-align:center;flex:1}
.ringbox small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.next{display:flex;align-items:center;justify-content:space-between;gap:10px}
.next small{color:var(--mute);font-size:12px}
.next b{display:block;font-size:17px}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(620px 520px at 50% 38%,#1a3a92,#050a1b 72%);animation:spOut .5s 1.7s forwards}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 0 0 1px rgba(90,130,255,.5),0 10px 40px rgba(43,80,255,.5)}
#splash .t{font-size:34px;font-weight:900;font-style:italic;direction:ltr;letter-spacing:1px}
#splash .t b{color:var(--acc);text-shadow:0 0 18px rgba(255,230,0,.55)}
#splash .g{direction:ltr;font-size:12px;letter-spacing:6px;color:var(--mute);display:flex;align-items:center;gap:10px}
#splash .g i{display:block;width:34px;height:2px;background:var(--acc);box-shadow:var(--glow)}
@keyframes spOut{to{opacity:0;visibility:hidden}}

/* ===== gradient + fade polish ===== */
:root{--gc:linear-gradient(160deg,rgba(46,86,200,.34) 0%,rgba(14,27,64,.9) 58%,rgba(8,16,40,.78) 100%);--gb:rgba(95,135,255,.24)}
nav{margin:0 -12px;padding:8px 12px 18px;background:linear-gradient(180deg,rgba(5,10,28,.98) 0%,rgba(5,10,28,.9) 50%,rgba(5,10,28,0) 100%);border-bottom:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.card{background:var(--gc);border:1px solid var(--gb);box-shadow:0 10px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.daybtn,.chip,.stat,.pill{background:var(--gc);border:1px solid var(--gb);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.daybtn.on{background:linear-gradient(160deg,rgba(255,230,0,.26) 0%,rgba(43,80,255,.32) 60%,rgba(10,20,52,.85) 100%);border-color:var(--acc);box-shadow:0 0 18px rgba(255,230,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.chip.on{background:linear-gradient(160deg,rgba(255,230,0,.22) 0%,rgba(43,80,255,.3) 65%,rgba(10,20,52,.85) 100%);border-color:var(--acc);box-shadow:0 0 14px rgba(255,230,0,.2)}
.pill.on{background:linear-gradient(135deg,#fff68a 0%,#ffe600 42%,#ffbf00 100%);color:#0a1020;border-color:#fff27a;font-weight:800;box-shadow:0 0 20px rgba(255,230,0,.55),0 4px 14px rgba(255,190,0,.35)}
.info{background:linear-gradient(145deg,rgba(43,80,255,.4) 0%,rgba(14,27,64,.9) 70%,rgba(8,16,40,.7) 100%);border:1px solid var(--gb);border-right:3px solid var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.note{background:linear-gradient(145deg,rgba(255,230,0,.16) 0%,rgba(255,230,0,.05) 60%,rgba(255,230,0,.02) 100%);border:1px solid rgba(255,230,0,.3)}
input[type=number],input[type=date],input[type=text],textarea,select{background:linear-gradient(180deg,#0c1736 0%,#070e24 100%);border:1px solid var(--gb)}
.btn.sec{background:var(--gc);border:1px solid var(--gb)}
.tag{background:linear-gradient(135deg,rgba(255,230,0,.2),rgba(255,230,0,.06))}
.freeit{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px dashed var(--gb);margin-top:8px;padding-top:6px;font-size:14px}
.freeit span:last-child{color:var(--acc);white-space:nowrap;font-size:13px}
</style>
</head>

 {id:"d1",t:"יום 1 · עליון A",s:"חזה · גב · כתף צדית · זרועות",ex:[

 {id:"d3",t:"יום 3 · עליון B",s:"חזה · גב · כתף אחורית · זרועות",ex:[

(async function initDb(){
  try{
    if(!(window.claude&&claude.use))return;
    var db=await claude.use("db"), user=await claude.use("user");
    if(!db||!user)return;
    var id=await user.id();
    dbRef=db.collection("data/users/"+id).doc("tracker");
    var snap=await dbRef.get();
    var d=snap&&(typeof snap.data==="function"?snap.data():snap);
    if(d&&d.json){
      var remote=JSON.parse(d.json);
      if((remote.ts||0)>(S.ts||0)){
        S=Object.assign(blank(),remote);
        try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        render();

  }catch(e){}

function bar(r){r=Math.max(0,Math.min(1,r));return '<div class="bar"><i style="width:'+Math.round(r*100)+'%"></i></div>'}

function chart(){
  var a=S.bw.slice().sort(function(x,y){return x.d<y.d?-1:1});
  if(a.length<2)return '<div class="small">הוסף לפחות 2 שקילות כדי לראות גרף.</div>';
  var W=640,H=190,pl=36,pr=10,pt=12,pb=26;
  var min=Math.min.apply(null,a.map(function(x){return x.v}))-0.5, max=Math.max.apply(null,a.map(function(x){return x.v}))+0.5;
  var t0=new Date(a[0].d).getTime(), t1=new Date(a[a.length-1].d).getTime(); if(t1===t0)t1=t0+1;
  function X(d){return pl+(new Date(d).getTime()-t0)/(t1-t0)*(W-pl-pr)}
  function Y(v){return pt+(max-v)/(max-min)*(H-pt-pb)}
  var pts=a.map(function(x){return X(x.d).toFixed(1)+","+Y(x.v).toFixed(1)}).join(" ");
  var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="גרף משקל">';
  for(var i=0;i<=3;i++){var v=min+(max-min)*i/3,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="var(--mute)">'+v.toFixed(1)+'</text>'}
  g+='<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
  a.forEach(function(x){g+='<circle cx="'+X(x.d)+'" cy="'+Y(x.v)+'" r="3.5" fill="var(--acc)"/>'});
  g+='<text x="'+pl+'" y="'+(H-6)+'" font-size="11" fill="var(--mute)">'+fmtD(a[0].d)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--mute)">'+fmtD(a[a.length-1].d)+'</text></svg>';
  return g;
}
function weekAvg(){
  var a=S.bw.slice().sort(function(x,y){return x.d<y.d?-1:1});
  if(a.length<2)return null;
  var f=a.slice(0,3), l=a.slice(-3);
  function avg(z){return z.reduce(function(s,x){return s+x.v},0)/z.length}
  var days=(new Date(a[a.length-1].d)-new Date(a[0].d))/864e5;

function iso(d){var x=new Date(d.getTime());x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function weekDates(){
  var d=new Date(today()+"T12:00:00");d.setDate(d.getDate()-d.getDay());
  var a=[];for(var i=0;i<7;i++){var x=new Date(d.getTime());x.setDate(d.getDate()+i);a.push(iso(x))}return a;
}
function counted(st){return st&&(st.d||(parseFloat(st.w)>0&&parseFloat(st.r)>0))}
function statsFor(dates){
  var sets={},vol=0,wo=0;dates.forEach(function(d){sets[d]=0});
  Object.keys(S.w).forEach(function(k){
    var r=S.w[k];if(!r.date||sets[r.date]===undefined)return;
    var n=0;Object.keys(r.sets).forEach(function(q){var st=r.sets[q];if(counted(st)){n++;var w=parseFloat(st.w),rp=parseFloat(st.r);if(w>0&&rp>0)vol+=w*rp}});
    sets[r.date]+=n;if(r.done)wo++;
  });
  return {sets:sets,vol:vol,wo:wo};
}
function ring(p,size,sw,val,id){
  p=Math.max(0,Math.min(1,p||0));var r=(size-sw)/2,c=2*Math.PI*r,m=size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img"><defs><linearGradient id="rg'+id+'" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2b50ff"/><stop offset="1" stop-color="#ffe600"/></linearGradient></defs>'+
   '<circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="rgba(120,150,255,.16)" stroke-width="'+sw+'"/>'+
   (p>0?'<circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" stroke="url(#rg'+id+')" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'" transform="rotate(-90 '+m+' '+m+')"/>':'')+
   '<text x="'+m+'" y="'+(m+size*0.08)+'" text-anchor="middle" font-size="'+Math.round(size*0.25)+'" font-weight="800" fill="#f1f4ff">'+val+'</text></svg>';
}
function barChart(dates,sets){
  var W=340,H=176,pt=22,pb=26,pl=14,pr=14,vals=dates.map(function(d){return sets[d]});
  var max=Math.max(8,Math.max.apply(null,vals)),step=(W-pl-pr)/7,bw=26,t=today();
  var names=["א","ב","ג","ד","ה","ו","ש"];
  var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="סטים שבוצעו בכל יום"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe600"/><stop offset="1" stop-color="#2b50ff"/></linearGradient></defs>';
  var pts=[];
  dates.forEach(function(d,i){
    var cx=W-pr-step*(i+0.5),h=Math.max(4,(H-pt-pb)*vals[i]/max),y=H-pb-h,isT=d===t;
    g+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="9" fill="url(#bg1)" opacity="'+(vals[i]===0?0.22:(isT?1:0.8))+'"/>';
    if(vals[i]>0)g+='<text x="'+cx+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#f1f4ff">'+vals[i]+'</text>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" font-weight="'+(isT?800:500)+'" fill="'+(isT?"#ffe600":"#9fb0d8")+'">'+names[i]+'</text>';
    pts.push([cx,y]);
  });
  g+='<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+","+(p[1]-0).toFixed(1)}).join(" ")+'" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="2 4"/>';
  pts.forEach(function(p){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.8" fill="#fff"/>'});
  return g+'</svg>';
}

  if(D.addbw!==undefined){var d=document.getElementById("bwd").value,v=parseFloat(document.getElementById("bwv").value);if(!d||!(v>30&&v<200))return;S.bw=S.bw.filter(function(x){return x.d!==d});S.bw.push({d:d,v:v});save();render();return}

  if(D.import!==undefined){try{var o=JSON.parse(document.getElementById("bk").value);if(!o||typeof o!=="object"||!o.w)throw 0;S=Object.assign(blank(),o);save();render();document.getElementById("bkmsg")&&0}catch(x){document.getElementById("bkmsg").textContent="הטקסט לא תקין"}return}
