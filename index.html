<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211e;--mute:#667570;--line:#dde4e1;--acc:#0f766e;--acc2:#e6f4f1;--warn:#b45309;--warnbg:#fff4e0;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--card:#182120;--ink:#e8efed;--mute:#93a39e;--line:#2a3735;--acc:#2dd4bf;--acc2:#12312d;--warn:#fbbf24;--warnbg:#33290f;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 2px;font-weight:800}
.sub{color:var(--mute);font-size:14px;margin-bottom:12px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pill.done{border-color:var(--ok)}
.daybtn{flex:1;min-width:140px;text-align:right;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.daybtn.on{border-color:var(--acc);background:var(--acc2)}
.daybtn small{display:block;color:var(--mute)}
.daybtn .ck{float:left;color:var(--ok);font-weight:800}
.note{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.info{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exh b{font-size:16px}
.tag{background:var(--acc2);color:var(--acc);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.hint{color:var(--mute);font-size:13px;margin:2px 0 6px}
.set{display:flex;align-items:center;gap:8px;margin:5px 0}
.set span.n{width:42px;color:var(--mute);font-size:13px}
input[type=number],input[type=date],input[type=text],textarea,select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;width:100%}
.set input[type=number]{width:84px;text-align:center}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.vid{color:var(--acc);font-weight:700;text-decoration:none}
.flag{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.flag.on{color:var(--bad);font-weight:700}
.btn{padding:12px 16px;border-radius:12px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--acc2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.meal{display:flex;gap:10px;align-items:flex-start}
.meal .body{flex:1}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.chip{text-align:right;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc2)}
.chip small{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
h2{font-size:18px;margin:6px 0}
h3{font-size:16px;margin:10px 0 4px}
ul{padding-right:20px;margin:6px 0}
li{margin:3px 0}
label.f{display:block;font-size:13px;color:var(--mute);margin:6px 0 2px}
.small{font-size:13px;color:var(--mute)}
</style>

/* ===================== מצב ושמירה ===================== */
var LS="fit_tracker_v1";
function blank(){return {ts:0,w:{},m:{},bw:[],ms:[],flags:{}}}
function loadLocal(){try{var j=localStorage.getItem(LS);if(j){var o=JSON.parse(j);return Object.assign(blank(),o)}}catch(e){}return blank()}
var S=loadLocal(), dbRef=null, tmr=null;
var UI={tab:"workout",week:0,day:0,date:today(),msg:""};
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function save(){
  S.ts=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(tmr);
  tmr=setTimeout(function(){
    if(dbRef){try{dbRef.set({json:JSON.stringify(S)})}catch(e){}}
  },900);
}
(async function initDb(){
  try{
    if(!(window.claude&&claude.use))return;
    var db=await claude.use("db"), user=await claude.use("user");
    if(!db||!user)return;
    var id=await user.id();
    dbRef=db.collection("data/users/"+id).doc("tracker");
    var snap=await dbRef.get();
    var d=snap&&(typeof snap.data==="function"?snap.data():snap);
    if(d&&d.json){
      var remote=JSON.parse(d.json);
      if((remote.ts||0)>(S.ts||0)){
        S=Object.assign(blank(),remote);
        try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        render();
      }
    }else if(S.ts){ dbRef.set({json:JSON.stringify(S)}); }
  }catch(e){}
})();

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function wk(w,d){var k="w"+w+d;return S.w[k]||(S.w[k]={sets:{},done:false,date:"",knee:"",sh:"",note:""})}
function prevVal(w,d,ei,si,key){
  for(var x=w-1;x>=0;x--){var o=S.w["w"+x+DAYS[d].id];if(o&&o.sets[ei+"_"+si]&&o.sets[ei+"_"+si][key])return o.sets[ei+"_"+si][key]}
  return ""
}
function meal(date){return S.m[date]||(S.m[date]={train:true,sel:{},eat:{},water:false,creatine:false})}
function fmtD(s){var p=s.split("-");return p[2]+"/"+p[1]}

function bkNudge(){
  if(!S.ts)return '';
  var last=S.bk?(Date.now()-new Date(S.bk).getTime())/864e5:999;
  if(last<7)return '';
  return '<div class="note">לא גיבית '+(S.bk?Math.floor(last)+' ימים':'עדיין')+'. כדאי לגבות פעם בשבוע: לשונית התקדמות ← גיבוי.</div>';
}
function sel(k,v){var o='<option value="">–</option>';for(var i=0;i<=10;i++)o+='<option value="'+i+'"'+(String(v)===String(i)?" selected":"")+'>'+i+'</option>';return '<select data-sel="'+k+'">'+o+'</select>'}

function totals(m){
  var k=0,p=0;
  MEALS.forEach(function(M,i){if(m.eat[i]){var o=M.opts[m.sel[i]||0];k+=o.k;p+=o.p}});
  return {k:k,p:p};
}

     M.opts.map(function(o,oi){return '<button class="chip '+(s===oi?"on":"")+'" data-opt="'+i+'_'+oi+'">'+o.n+' <small>· ~'+o.k+' קל׳ · '+o.p+' גר׳ חלבון</small></button>'}).join("")+'</div></div></div></div>';
  });

  h+='<div class="info">בוקר מהיר = השייק. ביום מנוחה אפשר לדלג על הארוחה הביניים ולהגדיל מעט את הפחמימה בצהריים ובערב. אם חסרות קלוריות: כף שמן זית, חופן אגוזים או פרוסת לחם נוספת.</div>';
  return h;
}
function bar(r){r=Math.max(0,Math.min(1,r));return '<div class="bar"><i style="width:'+Math.round(r*100)+'%"></i></div>'}

function chart(){
  var a=S.bw.slice().sort(function(x,y){return x.d<y.d?-1:1});
  if(a.length<2)return '<div class="small">הוסף לפחות 2 שקילות כדי לראות גרף.</div>';
  var W=640,H=190,pl=36,pr=10,pt=12,pb=26;
  var min=Math.min.apply(null,a.map(function(x){return x.v}))-0.5, max=Math.max.apply(null,a.map(function(x){return x.v}))+0.5;
  var t0=new Date(a[0].d).getTime(), t1=new Date(a[a.length-1].d).getTime(); if(t1===t0)t1=t0+1;
  function X(d){return pl+(new Date(d).getTime()-t0)/(t1-t0)*(W-pl-pr)}
  function Y(v){return pt+(max-v)/(max-min)*(H-pt-pb)}
  var pts=a.map(function(x){return X(x.d).toFixed(1)+","+Y(x.v).toFixed(1)}).join(" ");
  var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="גרף משקל">';
  for(var i=0;i<=3;i++){var v=min+(max-min)*i/3,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="var(--mute)">'+v.toFixed(1)+'</text>'}
  g+='<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>';
  a.forEach(function(x){g+='<circle cx="'+X(x.d)+'" cy="'+Y(x.v)+'" r="3.5" fill="var(--acc)"/>'});
  g+='<text x="'+pl+'" y="'+(H-6)+'" font-size="11" fill="var(--mute)">'+fmtD(a[0].d)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--mute)">'+fmtD(a[a.length-1].d)+'</text></svg>';
  return g;
}
function weekAvg(){
  var a=S.bw.slice().sort(function(x,y){return x.d<y.d?-1:1});
  if(a.length<2)return null;
  var f=a.slice(0,3), l=a.slice(-3);
  function avg(z){return z.reduce(function(s,x){return s+x.v},0)/z.length}
  var days=(new Date(a[a.length-1].d)-new Date(a[0].d))/864e5;
  return {first:avg(f),last:avg(l),days:days};
}

  h+='</div>';

   '<div><label class="f">תאריך</label><input type="date" id="msd" value="'+today()+'"></div>'+

   '<div><label class="f">חזה</label><input type="number" id="msc" step="0.1" inputmode="decimal"></div>'+

   '<div style="margin-top:8px"><button class="btn" data-addms="1">שמור מדידה</button></div>';
  if(S.ms.length)h+='<table style="margin-top:8px"><tr><th>תאריך</th><th>מותן</th><th>חזה</th><th>זרוע</th><th>ירך</th><th></th></tr>'+S.ms.slice().sort(function(x,y){return x.d<y.d?-1:1}).map(function(x){return '<tr><td>'+fmtD(x.d)+'</td><td>'+(x.w||"–")+'</td><td>'+(x.c||"–")+'</td><td>'+(x.a||"–")+'</td><td>'+(x.t||"–")+'</td><td><button class="flag" data-delms="'+x.d+'">מחק</button></td></tr>'}).join("")+'</table>';
  h+='</div>';

function vLifts(){
  var rows=[];
  DAYS.forEach(function(d){d.ex.forEach(function(e,ei){
    if(!e.m)return;
    var cells=WEEKS.map(function(_,w){
      var r=S.w["w"+w+d.id],b=null;
      if(r)Object.keys(r.sets).forEach(function(k){
        if(k.indexOf(ei+"_")!==0)return;
        var s=r.sets[k],kg=parseFloat(s.w),rp=parseFloat(s.r);
        if(kg>0&&rp>0&&(!b||kg>b.kg||(kg===b.kg&&rp>b.rp)))b={kg:kg,rp:rp};
      });
      return b?b.kg+"×"+b.rp:"–";
    });
    rows.push('<tr><td>'+e.n.split(",")[0].split(" (")[0].split(" /")[0]+'</td>'+cells.map(function(c){return '<td>'+c+'</td>'}).join("")+'</tr>');
  })});
  return '<div class="card"><h2>עומס בתרגילים המרכזיים</h2><div class="small">הטופ סט הכבד ביותר בכל שבוע (ק״ג × חזרות).</div><table><tr><th>תרגיל</th><th>ש׳1</th><th>ש׳2</th><th>ש׳3</th><th>ש׳4</th></tr>'+rows.join("")+'</table></div>';
}

   '<li>מעט עודף: ~2600 קלוריות ביום אימון, ~2400 ביום מנוחה (הערכה מאזן ~2400). זה מכוון לעלייה איטית של 0.15–0.3 ק״ג בשבוע, כדי להישאר חטוב.</li>'+
   '<li>חלבון ~140 גר׳ (כ־2 גר׳ לק״ג) ב־4 ארוחות. שומן ~70, השאר פחמימות, בעיקר סביב האימון.</li>'+
   '<li>אם אתה לא סופר קלוריות: בשבועיים הראשונים אוכלים לפי הארוחות בתפריט, בלי לספור, ושוקלים 3 פעמים בשבוע. הממוצע קובע אם מוסיפים או מורידים.</li>'+
   '<li>בוקר פשוט: שייק אחד בלנדר, 2 דקות. כל ארוחה אחרת ניתנת להחלפה בשייק אם אין זמן.</li></ul></div>'+
   '<div class="card"><h2>אירובי והליכה</h2><ul><li>אירובי אינו חובה כדי לעלות במסה. אבל הליכה של 20–30 דקות 2–3 פעמים בשבוע (או כ־7–8 אלף צעדים ביום) עוזרת להתאוששות ולבריאות הלב, ולא פוגעת בעלייה.</li><li>אם ההליכה מכאיבה לברך אחרי אימון רגליים, מדלגים עליה באותו יום ומדווחים בשדה "כאב ברך בהליכה למחרת".</li></ul></div>'+
   '<div class="card"><h2>איך מכווננים אחרי שבועיים</h2><ul>'+
   '<li><b>המשקל לא עלה</b> (ממוצע): מוסיפים ~150 קלוריות (עוד פרוסת לחם, אורז, או שייק).</li>'+
   '<li><b>עלה מעל 0.4 ק״ג בשבוע</b> או שהמותן גדל מעל 1.5 ס״מ: מורידים ~150 קלוריות.</li>'+
   '<li><b>עלה 0.15–0.3 והמותן יציב:</b> לא נוגעים בכלום.</li></ul></div>'+
   '<div class="note">זו תוכנית כללית ואינה תחליף לייעוץ רפואי או פיזיותרפי. עם רגישות בכתף ובברך, אם יש כאב שחוזר או מחמיר – כדאי לבדוק עם איש מקצוע. תוצאות בחודש אחד הן בעיקר ללמידה: מה הגוף שלך אוהב.</div>';
}
function render(){
  renderNav();
  var v=document.getElementById("view");
  v.innerHTML=UI.tab==="workout"?vWorkout():UI.tab==="food"?vFood():UI.tab==="progress"?vProgress():vGuide();
}

/* ===================== אירועים ===================== */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-week],[data-day],[data-flag],[data-done],[data-train],[data-eat],[data-opt],[data-addbw],[data-delbw],[data-addms],[data-delms],[data-export],[data-import]");
  if(!t)return;
  var D=t.dataset;
  if(D.tab){UI.tab=D.tab;render();window.scrollTo(0,0);return}
  if(D.week!==undefined){UI.week=+D.week;render();return}
  if(D.day!==undefined){UI.day=+D.day;render();return}
  if(D.flag){S.flags[D.flag]=!S.flags[D.flag];save();render();return}
  if(D.done){var r=wk(UI.week,DAYS[UI.day].id);r.done=!r.done;r.date=r.done?today():"";save();render();return}
  if(D.train!==undefined){meal(UI.date).train=D.train==="1";save();render();return}
  if(D.opt){var p=D.opt.split("_");meal(UI.date).sel[p[0]]=+p[1];meal(UI.date).eat[p[0]]=true;save();render();return}
  if(D.addbw!==undefined){var d=document.getElementById("bwd").value,v=parseFloat(document.getElementById("bwv").value);if(!d||!(v>30&&v<200))return;S.bw=S.bw.filter(function(x){return x.d!==d});S.bw.push({d:d,v:v});save();render();return}
  if(D.delbw){S.bw=S.bw.filter(function(x){return x.d!==D.delbw});save();render();return}
  if(D.addms!==undefined){var g=function(i){var x=parseFloat(document.getElementById(i).value);return isNaN(x)?"":x};var dd=document.getElementById("msd").value;if(!dd)return;S.ms=S.ms.filter(function(x){return x.d!==dd});S.ms.push({d:dd,w:g("msw"),c:g("msc"),a:g("msa"),t:g("mst")});save();render();return}
  if(D.delms){S.ms=S.ms.filter(function(x){return x.d!==D.delms});save();render();return}
  if(D.export!==undefined){var ta=document.getElementById("bk");ta.value=JSON.stringify(S);ta.select();S.bk=today();try{localStorage.setItem(LS,JSON.stringify(S))}catch(x){}var ok=false;try{navigator.clipboard.writeText(ta.value).then(function(){document.getElementById("bkmsg").textContent="הועתק ללוח"},function(){document.getElementById("bkmsg").textContent="סמן והעתק ידנית"});ok=true}catch(x){}if(!ok)document.getElementById("bkmsg").textContent="סמן והעתק ידנית";return}
  if(D.import!==undefined){try{var o=JSON.parse(document.getElementById("bk").value);if(!o||typeof o!=="object"||!o.w)throw 0;S=Object.assign(blank(),o);save();render();document.getElementById("bkmsg")&&0}catch(x){document.getElementById("bkmsg").textContent="הטקסט לא תקין"}return}
});
document.addEventListener("input",function(e){
  var t=e.target,D=t.dataset;
  if(D.set){var r=wk(UI.week,DAYS[UI.day].id),st=r.sets[D.set]||(r.sets[D.set]={});st[D.k]=t.type==="checkbox"?t.checked:t.value;save()}
  else if(D.note){wk(UI.week,DAYS[UI.day].id).note=t.value;save()}
});
document.addEventListener("change",function(e){
  var t=e.target,D=t.dataset;
  if(D.sel){wk(UI.week,DAYS[UI.day].id)[D.sel]=t.value;save()}
  else if(D.date){if(t.value){UI.date=t.value;render()}}
  else if(D.eat!==undefined){meal(UI.date).eat[D.eat]=t.checked;save();render()}
  else if(D.chk){meal(UI.date)[D.chk]=t.checked;save()}
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
